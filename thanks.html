<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 완료 — Parnas Hotel Collection</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --black:#1a1a1a; --white:#ffffff;
    --oatmeal:#f4efe6; --oatmeal-soft:#faf7f1; --oatmeal-deep:#e8e0d2;
    --gray:#8c8c8c; --line:#e7e3da; --line-soft:#efece4;
    --maxw:1080px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--white);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .container{max-width:var(--maxw);margin:0 auto;padding:0 32px;}

  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);}
  .nav{max-width:var(--maxw);margin:0 auto;padding:0 32px;height:64px;
    display:flex;align-items:center;justify-content:space-between;}
  .logo a{display:flex;align-items:center;}
  .logo img{height:28px;width:auto;display:block;}
  .nav-links{display:flex;gap:30px;list-style:none;}
  .nav-links a{text-decoration:none;color:var(--black);font-size:14px;font-weight:500;opacity:.8;transition:opacity .2s;}
  .nav-links a:hover{opacity:1;}

  .thanks{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 32px;}
  .thanks .mark{font-size:44px;margin-bottom:24px;}
  .thanks h1{font-size:clamp(28px,4vw,42px);font-weight:600;letter-spacing:-.02em;}
  .thanks p{font-size:15px;color:#666;margin-top:16px;max-width:520px;}
  .thanks .btn-dark{display:inline-flex;align-items:center;gap:8px;background:var(--black);color:var(--white);
    text-decoration:none;padding:13px 30px;border-radius:100px;font-size:14px;font-weight:500;margin-top:36px;transition:opacity .2s,transform .2s;}
  .thanks .btn-dark:hover{opacity:.85;transform:translateY(-1px);}

  footer{border-top:1px solid var(--line);padding:40px 0;background:var(--oatmeal-soft);}
  .foot-bottom{max-width:var(--maxw);margin:0 auto;padding:0 32px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .foot-bottom p,.foot-bottom a{font-size:12.5px;color:var(--gray);text-decoration:none;}
  .foot-bottom a:hover{color:var(--black);}
</style>
</head>
<body>

<header>
  <nav class="nav">
    <div class="logo"><a href="index.html"><img src="images/logo.png" alt="PARNAS Hotel Collection"></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#bedding">Products</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>
</header>

<section class="thanks">
  <div class="mark">&#10003;</div>
  <h1>문의가 정상적으로 접수되었습니다</h1>
  <p>소중한 문의 감사합니다. 영업일 기준 2일 이내에 입력주신 이메일로 회신드리겠습니다.</p>
  <a href="index.html" class="btn-dark">홈으로 돌아가기 &nbsp;&rsaquo;&rsaquo;</a>
</section>

<footer>
  <div class="foot-bottom">
    <p>© 2026 Parnas Hotel Collection. All Rights Reserved.</p>
    <a href="mailto:newbiz@parnas.co.kr">newbiz@parnas.co.kr</a>
  </div>
</footer>

</body>
</html>
